<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — IntervuX</title>

<!-- ═══════════════════════════════════════
     BACKEND WARM-UP — fires the instant this
     page starts loading, so Render's backend
     container is already awake by the time the
     user fills the form and clicks Register.
═══════════════════════════════════════ -->
<script>
(function warmBackend() {
  fetch("https://ai-interview-simulator-316l.onrender.com/ping").catch(function () {});
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
    --bg:            #F3F6FB;
    --bg-elevated:   #FFFFFF;
    --surface:       #EAEFF8;
    --surface-2:     #DCE4F2;
    --border:        rgba(13,27,54,0.09);
    --border-strong: rgba(13,27,54,0.17);

    --text:          #0E1726;
    --text-muted:    #5B6B84;
    --text-faint:    #96A3B8;

    --mint:          #00A98F;
    --mint-deep:     #00806D;
    --mint-dim:      rgba(0,169,143,0.12);
    --sky:           #6A4CF0;
    --sky-deep:      #5236C9;
    --sky-dim:       rgba(106,76,240,0.12);
    --coral:         #E23B76;
    --coral-dim:     rgba(226,59,118,0.12);

    --display: 'Space Grotesk', 'Inter', sans-serif;
    --body:    'Inter', -apple-system, sans-serif;
    --mono:    'JetBrains Mono', 'Courier New', monospace;
}

*{ margin:0; padding:0; box-sizing:border-box; }

body{
    font-family: var(--body);
    min-height: 100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
    -webkit-font-smoothing:antialiased;
}
body::before{
    content:"";
    position:fixed; inset:0; z-index:-1;
    background:
        radial-gradient(ellipse 900px 500px at 15% -5%, rgba(0,169,143,0.12), transparent 60%),
        radial-gradient(ellipse 700px 500px at 100% 100%, rgba(106,76,240,0.12), transparent 60%),
        repeating-linear-gradient(0deg, rgba(13,27,54,0.018) 0px, rgba(13,27,54,0.018) 1px, transparent 1px, transparent 42px),
        repeating-linear-gradient(90deg, rgba(13,27,54,0.018) 0px, rgba(13,27,54,0.018) 1px, transparent 1px, transparent 42px),
        var(--bg);
}
::selection{ background:var(--mint); color:#fff; }
a:focus-visible, button:focus-visible, input:focus-visible{ outline:2px solid var(--sky-deep); outline-offset:2px; }

/* REGISTER CARD — console panel with viewfinder corner brackets */
.register-wrap{ position:relative; width:420px; max-width:100%; padding:14px; }
.register-wrap::after{
    content:"";
    position:absolute; inset:0;
    pointer-events:none;
    background:
        linear-gradient(var(--mint), var(--mint)) top left / 20px 2px no-repeat,
        linear-gradient(var(--mint), var(--mint)) top left / 2px 20px no-repeat,
        linear-gradient(var(--mint), var(--mint)) top right / 20px 2px no-repeat,
        linear-gradient(var(--mint), var(--mint)) top right / 2px 20px no-repeat,
        linear-gradient(var(--sky), var(--sky)) bottom left / 20px 2px no-repeat,
        linear-gradient(var(--sky), var(--sky)) bottom left / 2px 20px no-repeat,
        linear-gradient(var(--sky), var(--sky)) bottom right / 20px 2px no-repeat,
        linear-gradient(var(--sky), var(--sky)) bottom right / 2px 20px no-repeat;
    opacity:.9;
}

.register{
  width: 100%;
  padding: 38px 36px;
  border-radius: 14px;
  background: var(--bg-elevated);
  border: 1px solid var(--border-strong);
  box-shadow: 0 24px 60px rgba(13,27,54,0.10);
  transition: box-shadow .3s ease;
  position:relative;
}
.register:hover{ box-shadow: 0 28px 70px rgba(13,27,54,0.14); }

.session-tag{
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--mint-deep);
  display:flex; align-items:center; justify-content:center; gap:7px;
  margin-bottom: 20px;
}
.session-tag::before{
  content:"";
  width:5px; height:5px; border-radius:50%;
  background: var(--mint);
  box-shadow: 0 0 6px rgba(0,169,143,0.6);
}

.logo{
  width:52px; height:52px; border-radius:12px;
  display:flex; align-items:center; justify-content:center;
  margin:0 auto 18px;
  background: linear-gradient(135deg, var(--mint-dim), var(--sky-dim));
  border: 1px solid rgba(0,169,143,0.3);
  font-size: 24px;
}

.title{
  text-align:center;
  font-family: var(--display);
  font-size: 24px;
  font-weight: 700;
  color: var(--text);
  letter-spacing:-0.01em;
}

.subtitle{
  text-align:center;
  color: var(--text-muted);
  font-size: 13.5px;
  margin-top: 8px;
  margin-bottom: 30px;
}

.input{ margin-bottom: 18px; }

.input label{
  font-size: 11.5px;
  font-weight: 700;
  color: var(--text-muted);
  font-family: var(--mono);
  text-transform: uppercase;
  letter-spacing: .08em;
}

.input input{
  width:100%;
  padding: 13px 14px;
  margin-top: 8px;
  border-radius: 9px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text);
  font-family: var(--body);
  font-size: 14.5px;
  transition: border-color .2s ease, background .2s ease;
}
.input input::placeholder{ color: var(--text-faint); }
.input input:focus{
  outline:none;
  border-color: var(--sky-deep);
  background: var(--bg-elevated);
}

#passMsg{
  margin-top: 9px;
  font-size: 12.5px;
  font-family: var(--mono);
  line-height: 1.7;
  color: var(--text-muted);
}

.register-btn{
  width:100%;
  padding: 14px;
  border:none;
  border-radius: 9px;
  font-size: 13.5px;
  font-weight: 700;
  font-family: var(--body);
  text-transform: uppercase;
  letter-spacing: .04em;
  background: var(--mint);
  color:#04120E;
  cursor:pointer;
  margin-top: 8px;
  box-shadow: 0 0 0 1px rgba(0,169,143,0.35), 0 10px 26px rgba(0,169,143,0.24);
  transition: transform .2s ease, box-shadow .2s ease, opacity .2s ease, background .2s ease;
  display:flex; align-items:center; justify-content:center; gap:9px;
}
.register-btn:hover{ transform:translateY(-2px); background:#00C6A7; box-shadow: 0 14px 32px rgba(0,169,143,0.32); }
.register-btn:active{ transform:translateY(0); }
.register-btn:disabled{
  opacity: .75;
  cursor: not-allowed;
  transform: none;
}

/* small spinner shown inside the button while a register request is in flight */
.spinner{
  width:15px; height:15px;
  border:2px solid rgba(4,18,14,0.35);
  border-top-color:#04120E;
  border-radius:50%;
  display:none;
  animation: spin .7s linear infinite;
}
.register-btn.loading .spinner{ display:inline-block; }
.register-btn.loading .btn-text{ opacity:.85; }
@keyframes spin{ to{ transform: rotate(360deg); } }

.footer{
  text-align:center;
  margin-top: 22px;
  font-size: 13.5px;
  color: var(--text-muted);
}

a{ color: var(--sky-deep); text-decoration:none; font-weight:600; }
a:hover{ text-decoration: underline; }
</style>
</head>

<body>

<div class="register-wrap">
<div class="register">

  <div class="session-tag">New session</div>

  <div class="logo">🎙️</div>

  <div class="title">Create Account</div>
  <div class="subtitle">Start practicing smarter, not harder.</div>

  <div class="input">
    <label>Full Name</label>
    <input id="name" placeholder="Enter full name">
  </div>

  <div class="input">
    <label>Email</label>
    <input id="email" placeholder="Enter email">
  </div>

  <div class="input">
    <label>Password</label>
    <input type="password" id="password" placeholder="Enter password" onkeyup="checkPassword()">
    <div id="passMsg">Password is required</div>
  </div>

  <button class="register-btn" id="registerBtn" onclick="register()">
    <span class="spinner"></span>
    <span class="btn-text">Register</span>
  </button>

  <div class="footer">
    Already have an account? <a href="01_login.html">Log in</a>
  </div>

</div>
</div>

<script>

// PASSWORD CHECK
function checkPassword(){

let password =
document.getElementById("password").value;

let msg =
document.getElementById("passMsg");

let upper =
/[A-Z]/.test(password);

let lower =
/[a-z]/.test(password);

let number =
/[0-9]/.test(password);

let special =
/[@$!%*?&]/.test(password);

let length =
password.length >= 8;


if(password===""){

msg.style.color="var(--text-muted)";

msg.innerHTML=
"Password is required";

return;

}


if(
upper &&
lower &&
number &&
special &&
length
){

msg.style.color="var(--mint-deep)";

msg.innerHTML=
"Strong Password ✔";

}

else{

msg.style.color="var(--coral)";

msg.innerHTML=

(upper ? "✔ Uppercase<br>" : "❌ Uppercase<br>") +

(lower ? "✔ Lowercase<br>" : "❌ Lowercase<br>") +

(number ? "✔ Number<br>" : "❌ Number<br>") +

(special ? "✔ Special Character<br>" : "❌ Special Character<br>") +

(length
? "✔ Minimum 8 Characters"
: "❌ Minimum 8 Characters");

}

}



// REGISTER → BACKEND → DATABASE
async function register(){

let name =
document
.getElementById("name")
.value
.trim();

let email =
document
.getElementById("email")
.value
.trim();

let password =
document
.getElementById("password")
.value
.trim();



if(
name==="" ||
email==="" ||
password===""
){

alert(
"Fill all fields"
);

return;

}



// PASSWORD VALIDATION
let pattern =
/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$/;


if(
!pattern.test(password)
){

alert(
"Password requirements not satisfied"
);

return;

}


let btn = document.getElementById("registerBtn");
let btnText = btn.querySelector(".btn-text");

// Immediate visual feedback the instant the click happens —
// button locks and shows a spinner so it never feels unresponsive,
// even while the network request (and any Render cold-start) is in flight.
btn.disabled = true;
btn.classList.add("loading");
btnText.textContent = "Creating account...";


try{

let response =
await fetch(
"https://ai-interview-simulator-316l.onrender.com/register",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({

name:name,
email:email,
password:password

})

}

);



let data =
await response.json();



if(response.ok){

alert(
data.message ||
"Registration Successful"
);


// CLEAR FIELDS
document.getElementById("name").value="";
document.getElementById("email").value="";
document.getElementById("password").value="";


// MOVE TO LOGIN
window.location.href =
"01_login.html";

return; // navigating away — no need to reset button state

}

else{

alert(
data.message ||
"Registration Failed"
);

}

}

catch(error){

console.log(error);

alert(
"Backend not running on port 8000"
);

}

finally{

// Only reached on failure paths (success already navigated away above)
btn.disabled = false;
btn.classList.remove("loading");
btnText.textContent = "Register";

}

}



// ENTER KEY SUPPORT
document.addEventListener(
"keydown",
function(event){

if(event.key==="Enter"){

register();

}

}
);

</script>

</body>
</html>
