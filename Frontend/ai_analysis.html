<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Resume Analysis — Intervux-AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
    --bg:            #05070B;
    --bg-elevated:   #0A0F17;
    --surface:       #0E1520;
    --surface-2:     #151E2C;
    --border:        rgba(0,230,195,0.14);
    --border-strong: rgba(0,230,195,0.32);

    --text:          #E9EEF7;
    --text-muted:    #8996AC;
    --text-faint:    #4C5872;

    --mint:          #00E6C3;
    --mint-deep:     #00B39B;
    --mint-dim:      rgba(0,230,195,0.13);
    --sky:           #8C6FFF;
    --sky-deep:      #6C4EF0;
    --sky-dim:       rgba(140,111,255,0.16);
    --coral:         #FF4D89;
    --coral-dim:     rgba(255,77,137,0.14);
    --amber:         #FFB020;
    --amber-dim:     rgba(255,176,32,0.14);

    --display: 'Space Grotesk', 'Inter', sans-serif;
    --body:    'Inter', -apple-system, sans-serif;
    --mono:    'JetBrains Mono', 'Courier New', monospace;
}

*{ box-sizing:border-box; margin:0; padding:0; }

body{
    font-family:var(--body);
    color:var(--text);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
    -webkit-font-smoothing:antialiased;
    background:var(--bg);
}
body::before{
    content:"";
    position:fixed; inset:0; z-index:-1;
    background:
        radial-gradient(ellipse 900px 500px at 18% -5%, rgba(0,230,195,0.10), transparent 60%),
        radial-gradient(ellipse 700px 500px at 100% 20%, rgba(140,111,255,0.12), transparent 60%),
        repeating-linear-gradient(0deg, rgba(255,255,255,0.014) 0px, rgba(255,255,255,0.014) 1px, transparent 1px, transparent 42px),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.014) 0px, rgba(255,255,255,0.014) 1px, transparent 1px, transparent 42px),
        var(--bg);
}

::selection{ background:var(--mint); color:#04120E; }
a:focus-visible, button:focus-visible, input:focus-visible{ outline:2px solid var(--sky-deep); outline-offset:3px; }

.page{ width:100%; max-width:600px; padding:14px; position:relative; }
/* viewfinder corner brackets, matching the transcript HUD signature */
.page::after{
    content:"";
    position:absolute; inset:0;
    pointer-events:none;
    background:
        linear-gradient(var(--mint), var(--mint)) top left / 22px 2px no-repeat,
        linear-gradient(var(--mint), var(--mint)) top left / 2px 22px no-repeat,
        linear-gradient(var(--mint), var(--mint)) top right / 22px 2px no-repeat,
        linear-gradient(var(--mint), var(--mint)) top right / 2px 22px no-repeat,
        linear-gradient(var(--sky), var(--sky)) bottom left / 22px 2px no-repeat,
        linear-gradient(var(--sky), var(--sky)) bottom left / 2px 22px no-repeat,
        linear-gradient(var(--sky), var(--sky)) bottom right / 22px 2px no-repeat,
        linear-gradient(var(--sky), var(--sky)) bottom right / 2px 22px no-repeat;
    opacity:.85;
}

.eyebrow{
    font-family:var(--mono);
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--mint);
    display:inline-flex; align-items:center; gap:8px;
    margin-bottom:10px;
}
.eyebrow::before{ content:""; width:5px; height:5px; border-radius:50%; background:var(--mint); box-shadow:0 0 8px rgba(0,230,195,0.6); }

.container {
  background: var(--bg-elevated);
  border-radius: 14px;
  border: 1px solid var(--border-strong);
  padding: 34px;
  box-shadow: 0 24px 56px rgba(0,0,0,0.55), 0 0 40px rgba(0,230,195,0.06);
}

h2 {
    font-family:var(--display); font-weight:600; font-size:23px;
    display:flex; align-items:center; gap:12px; margin-bottom:6px;
}
h2 .icon-badge{
    width:42px; height:42px; border-radius:10px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--mint-dim); border:1px solid rgba(0,230,195,0.32);
    font-size:19px;
}
.subtext{ color:var(--text-muted); font-size:13.5px; margin-bottom:24px; }

.upload-area {
  border: 2px dashed var(--border-strong);
  border-radius: 12px;
  padding: 28px 20px;
  text-align: center;
  cursor: pointer;
  transition: .25s ease;
  margin-bottom: 14px;
  background: var(--surface);
}
.upload-area:hover { border-color: var(--sky); background: var(--sky-dim); }
.upload-area input { display:none; }
.upload-area .emoji{ font-size:1.9rem; margin-bottom:6px; }
.upload-area p { color: var(--text-muted); font-size:13.5px; margin-top:5px; }
.upload-area p.hint{ color: var(--text-faint); font-size:12px; }

#fileName{
    text-align:center; font-family:var(--mono); font-size:12.5px;
    color:var(--mint); margin-bottom:14px; min-height:18px;
}

button {
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 9px;
  font-weight: 700;
  font-size: 13.5px;
  cursor: pointer;
  transition: .25s ease;
  margin-bottom: 10px;
  font-family:var(--body);
  text-transform:uppercase;
  letter-spacing:.04em;
}
#analyzeBtn{
  background: var(--mint);
  color: #04120E;
  box-shadow: 0 0 0 1px rgba(0,230,195,0.4), 0 8px 26px rgba(0,230,195,0.28);
}
#analyzeBtn:hover { transform: translateY(-2px); background:#1FF2D2; box-shadow:0 0 0 1px rgba(0,230,195,0.55), 0 12px 32px rgba(0,230,195,0.4); }
#analyzeBtn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; box-shadow:none; }

.back-btn {
  background: transparent;
  border: 1px solid var(--border-strong);
  color: var(--text-muted);
  text-transform:none;
  letter-spacing:normal;
  font-weight:600;
}
.back-btn:hover { background: var(--surface); color: var(--text); border-color:var(--border-strong); }

.result { display:none; margin-top:22px; }

.score-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
  margin-bottom: 16px;
}
.score-box {
  background: var(--surface);
  border-radius: 12px;
  padding: 16px 10px;
  text-align: center;
  border: 1px solid var(--border);
}
.score-box .val { font-family:var(--display); font-size: 25px; font-weight: 700; }
.score-box .lbl { font-family:var(--mono); font-size: 10.5px; color: var(--text-faint); margin-top: 4px; text-transform:uppercase; letter-spacing:.05em; }

.section {
  background: var(--surface);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
  border: 1px solid var(--border);
}
.section-title {
    font-family:var(--mono); font-size: 11px; font-weight: 700; color: var(--mint);
    text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px;
}

.badge {
  display: inline-block;
  padding: 5px 12px;
  margin: 3px;
  border-radius: 999px;
  background: var(--sky-dim);
  color: var(--sky);
  font-size: 12px;
  font-weight:500;
  border: 1px solid rgba(140,111,255,0.32);
}

.verdict {
  padding: 11px 14px;
  border-radius: 10px;
  font-weight: 700;
  font-size: 14px;
  text-align: center;
  margin-bottom: 14px;
}
.verdict.strong   { background: var(--mint-dim);  color: var(--mint);  border: 1px solid rgba(0,230,195,0.35); }
.verdict.moderate { background: var(--amber-dim); color: var(--amber); border: 1px solid rgba(255,176,32,0.35); }
.verdict.weak      { background: var(--coral-dim); color: var(--coral); border: 1px solid rgba(255,77,137,0.35); }

.list-item { display:flex; gap:9px; align-items:flex-start; font-size:13px; margin-bottom:8px; color:var(--text); line-height:1.5; }
.list-item:last-child{ margin-bottom:0; }
.list-item .icon { flex-shrink:0; font-weight:700; }

.bar-row { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.bar-row:last-child{ margin-bottom:0; }
.bar-lbl { width: 112px; font-size: 12px; color: var(--text-muted); flex-shrink:0; }
.bar-track { flex:1; height:8px; background:var(--surface-2); border-radius:999px; overflow:hidden; }
.bar-fill { height:100%; border-radius:999px; background:linear-gradient(90deg, var(--mint), var(--sky)); box-shadow:0 0 10px rgba(0,230,195,0.4); transition:width 1s ease; }
.bar-val { width:36px; text-align:right; font-family:var(--mono); font-size:12px; font-weight:600; color:var(--sky); }

.spinner {
    width:28px; height:28px; border:3px solid var(--border-strong);
    border-top-color: var(--mint); border-radius:50%;
    animation:spin 0.8s linear infinite; margin:0 auto;
}
@keyframes spin { to { transform:rotate(360deg); } }
.loading { text-align:center; padding:26px 10px; }
.loading p { margin-top:12px; color:var(--text-muted); font-size:13px; font-family:var(--mono); }

.summary-text{ font-size:13px; line-height:1.7; color:var(--text-muted); }
.feedback-text{ font-size:13px; color:var(--text-muted); margin-top:6px; line-height:1.6; }

.cta-link{
    display:block; text-align:center; padding:13px;
    background:var(--mint);
    border-radius:9px; color:#04120E; font-weight:700; text-decoration:none;
    margin-top:6px; font-size:13.5px;
    text-transform:uppercase; letter-spacing:.04em;
    box-shadow:0 0 0 1px rgba(0,230,195,0.4), 0 8px 26px rgba(0,230,195,0.25);
    transition:transform .2s ease, background .2s ease;
}
.cta-link:hover{ transform:translateY(-2px); background:#1FF2D2; }

.error-msg{ text-align:center; padding:22px; color:var(--coral); font-size:13.5px; font-weight:500; }

@media (max-width:600px){
    .container{ padding:24px; }
    .score-row{ gap:8px; }
}
</style>
</head>
<body>
<div class="page">

  <div class="container">
    <span class="eyebrow">AI-Powered</span>
    <h2>
      <span class="icon-badge">🤖</span>
      AI Resume Analysis
    </h2>
    <p class="subtext">Upload your resume for a full AI pass — ATS score, skills, strengths, gaps, and a plain-language verdict.</p>

    <div class="upload-area" id="dropZone" onclick="document.getElementById('resumeFile').click()">
      <div class="emoji">📄</div>
      <p>Click to upload your resume</p>
      <p class="hint">Supports PDF, DOCX, TXT</p>
      <input type="file" id="resumeFile" accept=".pdf,.docx,.txt" onchange="handleFile(this)">
    </div>

    <div id="fileName"></div>

    <button id="analyzeBtn" onclick="analyzeResume()">⚡ Run Full AI Analysis</button>

    <div class="result" id="result">
      <div id="resultContent"></div>
    </div>

    <button class="back-btn" onclick="window.location.href='index.html'">← Back</button>
  </div>

</div>

<script>
const BACKEND = "https://intervux-ai.onrender.com";

function handleFile(input) {
  const file = input.files[0];
  if (file) document.getElementById('fileName').textContent = '📎 ' + file.name;
}

async function analyzeResume() {
  const file = document.getElementById("resumeFile").files[0];
  if (!file) { alert("Please select a resume file first"); return; }

  const btn = document.getElementById("analyzeBtn");
  const result = document.getElementById("result");
  const content = document.getElementById("resultContent");

  btn.disabled = true;
  btn.textContent = "Analyzing...";
  result.style.display = "block";
  content.innerHTML = `<div class="loading"><div class="spinner"></div><p>AI is performing deep analysis...</p></div>`;

  try {
    const formData = new FormData();
    formData.append("resume", file);

    const res = await fetch(`${BACKEND}/analyze-resume`, { method: "POST", body: formData });
    const data = await res.json();

    // Verdict styling
    const verdictClass = data.ai_verdict?.toLowerCase().includes("strong") ? "strong"
                       : data.ai_verdict?.toLowerCase().includes("moderate") ? "moderate" : "weak";

    // Skill breakdown bars
    const breakdown = data.skill_breakdown || {};
    const barsHTML = Object.entries(breakdown).map(([k,v]) => `
      <div class="bar-row">
        <span class="bar-lbl">${k}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${v}%"></div></div>
        <span class="bar-val">${v}%</span>
      </div>`).join('');

    const skills = data.ai_skills_found || [];
    const strengths = data.strengths || [];
    const suggestions = data.suggestions || [];

    content.innerHTML = `
      <div class="score-row">
        <div class="score-box"><div class="val" style="color:var(--sky)">${data.ats_score}%</div><div class="lbl">ATS Score</div></div>
        <div class="score-box"><div class="val" style="color:var(--mint)">${data.resume_score ?? data.readiness}%</div><div class="lbl">Resume Score</div></div>
        <div class="score-box"><div class="val" style="color:var(--coral)">${data.readiness}%</div><div class="lbl">Readiness</div></div>
      </div>

      <div class="verdict ${verdictClass}">${data.ai_verdict}</div>

      ${data.summary ? `
      <div class="section">
        <div class="section-title">AI Summary</div>
        <p class="summary-text">${data.summary}</p>
      </div>` : ''}

      <div class="section">
        <div class="section-title">Skills Detected (${data.skills})</div>
        ${skills.map(s => `<span class="badge">${s}</span>`).join('') || '<p style="font-size:13px;color:var(--text-faint);">No skills detected</p>'}
      </div>

      ${barsHTML ? `<div class="section"><div class="section-title">Skill Breakdown</div>${barsHTML}</div>` : ''}

      ${strengths.length ? `
      <div class="section">
        <div class="section-title">Strengths</div>
        ${strengths.map(s => `<div class="list-item"><span class="icon" style="color:var(--mint)">✓</span><span>${s}</span></div>`).join('')}
      </div>` : ''}

      ${suggestions.length ? `
      <div class="section">
        <div class="section-title">Suggestions to Improve</div>
        ${suggestions.map(s => `<div class="list-item"><span class="icon" style="color:var(--amber)">→</span><span>${s}</span></div>`).join('')}
      </div>` : ''}

      ${data.ai_feedback ? `
      <div class="section">
        <div class="section-title">AI Feedback</div>
        <p class="feedback-text">${data.ai_feedback}</p>
      </div>` : ''}

      <a href="interview.html" class="cta-link">🎙️ Start Interview Now</a>
    `;
  } catch (e) {
    content.innerHTML = `<div class="error-msg">Error running analysis. Please try again.</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = "⚡ Run Full AI Analysis";
  }
}
</script>
</body>
</html>
